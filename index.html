<script>
const SUPABASE_URL="https://vvzalcepxmlvgenxxykb.supabase.co";
const SUPABASE_KEY="sb_publishable__2PcCGXtMDCTckWTPYgCHw_zTTPiGM2";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const TABLE_NAME = "auditorias_historico";
const SIGLAS_TRATAMENTO_VALIDAS = ["TSI", "ST", "FT", "IN", "FUN", "GRAO", "TRAT", "SO", "SOIE", "FD", "FDIE", "FDIEAR", "FDIEVC", "FEIE"];

let base=[], audits=[], dashData=[], filteredData=[], selected=null, meta={};

const MONTH_MAP = {
  "01":"JAN","02":"FEV","03":"MAR","04":"ABR","05":"MAI","06":"JUN",
  "07":"JUL","08":"AGO","09":"SET","10":"OUT","11":"NOV","12":"DEZ",
  "JAN":"JAN","FEV":"FEV","MAR":"MAR","ABR":"ABR","MAI":"MAI","JUN":"JUN",
  "JUL":"JUL","AGO":"AGO","SET":"SET","OUT":"OUT","NOV":"NOV","DEZ":"DEZ"
};

const ALL_MONTHS = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];

const $=id=>document.getElementById(id), v=id=>$(id).value, set=(id,x)=>$(id).value=x??"";
function toast(t){$("toast").textContent=t;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),3500)}
function go(id){["home","start","lots"].forEach(x=>$(x).classList.toggle("hidden",x!==id));if(id==="home")dashboard();if(id==="start")loadLocalsStart()}
function esc(x){return String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}

function month(){
  let parts = v("date").split("-");
  return parts.length === 3 ? (MONTH_MAP[parts[1]] || "JAN") : "JAN";
}

$("date").value=new Date().toISOString().slice(0,10);$("month").value=month();$("date").onchange=()=>set("month",month());

/* MODAL E IMPORTAÇÃO DE PLANILHA */
function abrirModalImportacao() {
  $("modal-importacao").classList.remove("hidden");
  $("status-importacao").innerText = "";
  $("input-excel").value = "";
}

function fecharModalImportacao() {
  $("modal-importacao").classList.add("hidden");
  $("input-excel").value = "";
}

async function processarEEnviarPlanilha() {
  const input = $("input-excel");
  const divStatus = $("status-importacao");

  if (!input.files || input.files.length === 0) {
    return alert("Por favor, selecione um arquivo de planilha.");
  }

  const file = input.files[0];
  divStatus.innerText = "Lendo e validando dados da planilha...";

  const reader = new FileReader();
  reader.onload = async function (e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      
      const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

      if (rows.length < 2) {
        divStatus.innerText = "❌ A planilha precisa ter ao menos cabeçalho e linhas de dados.";
        return;
      }

      const parseNumStrict = (val) => {
        if (typeof val === "number") return isNaN(val) ? 0 : val;
        if (val === null || val === undefined) return 0;
        
        let s = String(val).trim();
        if (!s) return 0;

        if (s.includes("/") || /[a-zA-Z]/.test(s)) return 0;

        s = s.replace(/[^0-9.,-]/g, "");
        if (!s) return 0;

        if (s.includes(",") && s.includes(".")) {
          s = s.replace(/\./g, "").replace(",", ".");
        } else if (s.includes(",")) {
          s = s.replace(",", ".");
        }

        const n = parseFloat(s);
        return isNaN(n) ? 0 : n;
      };

      const registrosParaInserir = [];

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;

        const getColVal = (idx) => (idx >= 0 && row[idx] !== undefined) ? String(row[idx]).trim() : "";

        const filial = getColVal(0);
        const colB = getColVal(1);
        const colC = getColVal(2);
        const deposito = getColVal(3);
        const cultura = getColVal(4) || getColVal(5);
        const colI = getColVal(8);
        const lote = getColVal(9) || getColVal(8) || getColVal(7);
        const cat = getColVal(10);
        const pen = getColVal(11);
        const um = getColVal(12) || "BAG";

        let colAE = 0;

        for (let c = row.length - 1; c >= 0; c--) {
          let numCandidate = parseNumStrict(row[c]);
          if (numCandidate > 0) {
            colAE = numCandidate;
            break;
          }
        }

        if (!lote || colAE <= 0) continue;

        let localFinal = "";
        let ufFinal = "";
        
        const bClean = colB.replace(/^0+/, "");
        const cClean = colC.replace(/^0+/, "");

        if ((bClean === "101" || colB === "0101") && (cClean === "10" || colC === "10")) {
          localFinal = "UBS I"; ufFinal = "GO";
        } else if ((bClean === "102" || colB === "102") && (cClean === "10" || colC === "10")) {
          localFinal = "LPCO"; ufFinal = "GO";
        } else if (colB.includes("BJ") || colC.includes("BJ")) {
          localFinal = "BJ"; ufFinal = "MG";
        } else if (colB.includes("AGROSEMEAR") || colC.includes("AGROSEMEAR")) {
          localFinal = "AGROSEMEAR"; ufFinal = "MT";
        } else {
          localFinal = colB || colC || "GERAL"; ufFinal = "GO";
        }

        const partesTratamento = colI.split(/\s+/);
        const ultimaSigla = partesTratamento[partesTratamento.length - 1].toUpperCase();
        const tratamentoFinal = SIGLAS_TRATAMENTO_VALIDAS.includes(ultimaSigla) ? ultimaSigla : "ST";

        registrosParaInserir.push({
          local: localFinal,
          uf: ufFinal,
          filial: filial,
          deposito: deposito,
          cultura: cultura,
          lote: lote,
          cultivar: cultura,
          Tratamento: tratamentoFinal,
          cat: cat,
          pen: pen,
          um: um,
          qtd_sistema: colAE,
          peso_etiqueta: null
        });
      }

      if (registrosParaInserir.length === 0) {
        divStatus.innerText = "⚠️ Nenhum registro válido encontrado com quantidade numérica > 0.";
        return;
      }

      divStatus.innerText = `Salvando ${registrosParaInserir.length} registros no Supabase...`;

      const { error } = await db.from('base_dados').upsert(registrosParaInserir);
      if (error) throw error;

      divStatus.innerText = "✅ Importação concluída com sucesso!";
      await loadLocalsStart();
      await dashboard();

      setTimeout(() => { fecharModalImportacao(); }, 1500);
    } catch (err) {
      console.error(err);
      divStatus.innerText = "❌ Erro ao processar planilha: " + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
}

async function loadLocalsStart(){
  let { data, error } = await db.from("base_dados").select("local").range(0, 4999);
  if (error) return toast("Erro ao buscar locais: " + error.message);
  
  let a = [...new Set((data || []).map(x => x.local).filter(Boolean))].sort();
  $("local").innerHTML = '<option value="">Selecione...</option>' + a.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("");
}

async function loadHistoryFilters(){
  let [{ data: rawHist }, { data: rawBase }] = await Promise.all([
    db.from(TABLE_NAME).select("mes, local, cultura").range(0, 4999),
    db.from("base_dados").select("local, cultura").range(0, 4999)
  ]);
  
  let allHist = rawHist || [];
  let allBase = rawBase || [];

  let recordedMonths = new Set(allHist.map(x=>x.mes).filter(Boolean));
  let sortedMonths = ALL_MONTHS.filter(m => recordedMonths.has(m));
  
  let locals=[...new Set([...allHist.map(x=>x.local), ...allBase.map(x=>x.local)].filter(Boolean))].sort();
  let culturas=[...new Set([...allHist.map(x=>x.cultura), ...allBase.map(x=>x.cultura)].filter(Boolean))].sort();

  let curMonth=v("dashMonth"), curLocal=v("dashLocal"), curCultura=v("dashCultura");

  $("dashMonth").innerHTML='<option value="">Todos os Meses</option>'+sortedMonths.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
  $("dashLocal").innerHTML='<option value="">Todos os Locais</option>'+locals.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
  $("dashCultura").innerHTML='<option value="">Todas as Culturas</option>'+culturas.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");

  $("dashMonth").value=curMonth;
  $("dashLocal").value=curLocal;
  $("dashCultura").value=curCultura;
}

async function dashboard(){
  await loadHistoryFilters();

  let selMonth=v("dashMonth").toUpperCase().trim();
  let selLocal=v("dashLocal").toUpperCase().trim();
  let selCultura=v("dashCultura").toUpperCase().trim();

  let queryAudits = db.from(TABLE_NAME).select("*").range(0, 4999);
  if(selLocal) queryAudits = queryAudits.eq("local", selLocal);
  if(selMonth) queryAudits = queryAudits.eq("mes", selMonth);
  if(selCultura) queryAudits = queryAudits.eq("cultura", selCultura);

  let { data: rawAudits, error: errAudits } = await queryAudits;
  if(errAudits) {
    console.error("Erro ao buscar histórico:", errAudits);
    toast("Erro ao carregar auditorias.");
    return;
  }

  let combinedData = [];

  if (selLocal) {
    let queryBase = db.from("base_dados").select("*").eq("local", selLocal).range(0, 4999);
    if(selCultura) queryBase = queryBase.eq("cultura", selCultura);
    let { data: rawBase } = await queryBase;
    
    let auditsMap = new Map();
    (rawAudits || []).forEach(a => auditsMap.set(`${a.local}_${a.lote}_${a.mes}`, a));

    (rawBase || []).forEach(b => {
      let auditKey = `${b.local}_${b.lote}_${selMonth}`;
      let a = auditsMap.get(auditKey);
      combinedData.push({
        mes: a?.mes || selMonth || "—",
        lote: b.lote,
        local: b.local,
        cultura: b.cultura,
        cultivar: b.cultivar,
        cat: b.cat,
        qtd_sistema: b.qtd_sistema,
        qtd_fisica: a?.qtd_fisica ?? null,
        status: a?.status || "PENDENTE",
        data_verificacao: a?.data_verificacao || null,
        auditor_pcp: a?.auditor_pcp || null,
        auditor_unidade: a?.auditor_unidade || null,
        responsavel_ubs: a?.responsavel_ubs || null,
        observacao: a?.observacao || null
      });
    });
  } else {
    combinedData = rawAudits || [];
  }

  dashData = combinedData;

  let totLotes = dashData.length;
  let auditados = dashData.filter(x => x.qtd_fisica !== null && x.qtd_fisica !== undefined).length;
  let validados = dashData.filter(x => x.status === "VALIDADO").length;
  let pendentes = totLotes - auditados;
  
  let accVal = auditados > 0 ? ((validados / auditados) * 100).toFixed(1) : "0.0";

  $("tot").textContent = totLotes;
  $("aud").textContent = auditados;
  $("pen").textContent = pendentes < 0 ? 0 : pendentes;
  $("val").textContent = validados;
  $("acc").textContent = accVal + "%";
  $("accBarTxt").textContent = accVal + "%";
  $("accBar").style.width = accVal + "%";

  renderDashTable();
}

  let q=v("dashSearch").toUpperCase();
  filteredData=dashData.filter(x=>
    String(x.lote).toUpperCase().includes(q) || 
    String(x.cultivar||"").toUpperCase().includes(q) || 
    String(x.local||"").toUpperCase().includes(q) ||
    String(x.cultura||"").toUpperCase().includes(q) ||
    String(x.mes||"").toUpperCase().includes(q)
  );

  $("dashTableBody").innerHTML=filteredData.map(x=>{
    let cl=x.status==="VALIDADO"?"ok":x.status==="DIVERGÊNCIA"?"bad":x.status==="PENDENTE"?"warn":"muted";
    return `<tr>
      <td><b>${esc(x.mes)}</b></td>
      <td><b>${esc(x.lote)}</b></td>
      <td>${esc(x.local)}</td>
      <td>${esc(x.cultura)}</td>
      <td>${esc(x.cultivar)}</td>
      <td>${esc(x.cat)}</td>
      <td>${x.qtd_sistema??"—"}</td>
      <td>${x.qtd_fisica??"—"}</td>
      <td><span class="${cl}">${esc(x.status)}</span></td>
    </tr>`;
  }).join("") || '<tr><td colspan="9" class="muted" style="text-align:center">Nenhuma auditoria encontrada.</td></tr>';
}

function exportToCSV(){
  if(!filteredData || filteredData.length===0) return toast("Nenhum dado para exportar.");
  let csv=["\uFEFFMes Auditoria;Data Verificacao;Lote;Local;Cultura;Cultivar;Categoria;Qtd Sistema;Qtd Fisica;Status;Auditor PCP;Auditor Unidade;Responsavel UBS;Observacao"];
  filteredData.forEach(x=>{
    let obs = String(x.observacao||'').replaceAll('"','""').replaceAll('\n',' ');
    csv.push(`"${x.mes}";"${x.data_verificacao||''}";"${x.lote}";"${x.local||''}";"${x.cultura||''}";"${x.cultivar||''}";"${x.cat||''}";"${x.qtd_sistema??""}";"${x.qtd_fisica??""}";"${x.status}";"${x.auditor_pcp||''}";"${x.auditor_unidade||''}";"${x.responsavel_ubs||''}";"${obs}"`);
  });
  let blob=new Blob([csv.join("\n")], {type:"text/csv;charset=utf-8;"});
  let link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.setAttribute("download", `historico_auditorias_${new Date().toISOString().slice(0,10)}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

async function start(){
  let local=v("local");
  if(!local)return toast("Selecione o local.");
  
  let btn = $("btnStartAudit");
  btn.disabled = true;
  btn.textContent = "Carregando...";

  meta={local,data_verificacao:v("date"),mes:month(),auditor_pcp:v("pcp"),auditor_unidade:v("audun"),responsavel_ubs:v("ubs")};
  $("lt").textContent=local;

  set("search","");
  set("lotCultura","");
  set("lotCultivar","");
  set("lotStatus","");
  
  let {data:b,error}=await db.from("base_dados").select("*").eq("local",local).order("lote").range(0, 4999);
  if(error) {
    btn.disabled = false;
    btn.textContent = "INICIAR CONFERÊNCIA";
    return toast(error.message);
  }
  base=b||[];
  
  let {data:a,error:e}=await db.from(TABLE_NAME)
    .select("*")
    .eq("local",meta.local)
    .eq("data_verificacao",meta.data_verificacao)
    .range(0, 4999);
  if(e) {
    btn.disabled = false;
    btn.textContent = "INICIAR CONFERÊNCIA";
    return toast(e.message);
  }
  audits=a||[];
  
  populateLotFilters();
  render();
  go("lots");
  
  btn.disabled = false;
  btn.textContent = "INICIAR CONFERÊNCIA";
}

function populateLotFilters(){
  let culturas=[...new Set(base.map(x=>x.cultura).filter(Boolean))].sort();
  let cultivares=[...new Set(base.map(x=>x.cultivar).filter(Boolean))].sort();
  
  $("lotCultura").innerHTML='<option value="">Todas</option>'+culturas.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
  $("lotCultivar").innerHTML='<option value="">Todas</option>'+cultivares.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");
}

function render(){
  let q=v("search").toUpperCase();
  let fCul=v("lotCultura").toUpperCase();
  let fCv=v("lotCultivar").toUpperCase();
  let fSt=v("lotStatus").toUpperCase();

  let amap=new Map(audits.map(x=>[x.lote,x]));
  let tot=base.length, aud=0, val=0;

  let html=base.map(b=>{
    let a=amap.get(b.lote);
    let st=a?a.status:"PENDENTE";
    if(a) aud++;
    if(st==="VALIDADO") val++;

    if(q && !String(b.lote).toUpperCase().includes(q)) return "";
    if(fCul && String(b.cultura||"").toUpperCase()!==fCul) return "";
    if(fCv && String(b.cultivar||"").toUpperCase()!==fCv) return "";
    if(fSt && st!==fSt) return "";

    let stCl=st==="VALIDADO"?"ok":st==="DIVERGÊNCIA"?"bad":"warn";
    let divClass=st==="DIVERGÊNCIA"?"divergent-border":"";

    return `<div class="lot ${divClass}" onclick="openConf('${esc(b.lote)}')">
      <div><b>${esc(b.lote)}</b></div>
      <div>${esc(b.cultivar||'—')} · ${esc(b.cat||'—')} · ${esc(b.pen||'—')}</div>
      <div><b>${b.qtd_sistema}</b> ${esc(b.um||'')}</div>
      <div><span class="${stCl}">${st}</span></div>
    </div>`;
  }).join("");

  $("list").innerHTML = html || '<div class="muted" style="padding:20px;text-align:center">Nenhum lote encontrado.</div>';

  $("stot").textContent = tot;
  $("saud").textContent = aud;
  $("spen").textContent = tot - aud;
  $("sval").textContent = val;
  $("sacc").textContent = (aud > 0 ? ((val / aud) * 100).toFixed(1) : "0.0") + "%";
}

function openConf(loteStr){
  selected = base.find(x => x.lote === loteStr);
  if (!selected) return;

  $("clote").textContent = selected.lote;
  $("sys").innerHTML = `
    <b>Cultivar:</b> ${esc(selected.cultivar||'—')} | <b>Cat:</b> ${esc(selected.cat||'—')} | <b>Penera:</b> ${esc(selected.pen||'—')}<br>
    <b>Qtd Sistema:</b> ${selected.qtd_sistema} ${esc(selected.um||'')} | <b>Tratamento:</b> ${esc(selected.Tratamento||'—')}
  `;

  let a = audits.find(x => x.lote === selected.lote);
  if (a) {
    set("catfis", a.cat_fisica);
    set("etq", a.etiqueta_fisica);
    set("qtd", a.qtd_fisica);
    set("cam", a.camara);
    set("quad", a.quadra);
    set("fila", a.fileira);
    set("obs", a.observacao);
    $("btnDeleteConf").classList.remove("hidden");
  } else {
    set("catfis", selected.cat);
    set("etq", "");
    set("qtd", "");
    set("cam", "");
    set("quad", "");
    set("fila", "");
    set("obs", "");
    $("btnDeleteConf").classList.add("hidden");
  }

  $("conf").classList.remove("hidden");
}

function closeConf(){
  $("conf").classList.add("hidden");
  selected = null;
}

async function save(){
  if (!selected) return;

  let qtdFis = parseFloat(v("qtd"));
  if (isNaN(qtdFis)) return toast("Informe a quantidade física.");

  let status = (qtdFis === Number(selected.qtd_sistema)) ? "VALIDADO" : "DIVERGÊNCIA";

  let record = {
    local: meta.local,
    data_verificacao: meta.data_verificacao,
    mes: meta.mes,
    auditor_pcp: meta.auditor_pcp,
    auditor_unidade: meta.auditor_unidade,
    responsavel_ubs: meta.responsavel_ubs,
    lote: selected.lote,
    cultura: selected.cultura,
    cultivar: selected.cultivar,
    cat: selected.cat,
    cat_fisica: v("catfis"),
    etiqueta_fisica: v("etq"),
    qtd_sistema: selected.qtd_sistema,
    qtd_fisica: qtdFis,
    camara: v("cam"),
    quadra: v("quad"),
    fileira: v("fila"),
    observacao: v("obs"),
    status: status
  };

  let { error } = await db.from(TABLE_NAME).upsert(record, { onConflict: 'local,lote,data_verificacao' });
  if (error) return toast("Erro ao salvar auditoria: " + error.message);

  let idx = audits.findIndex(x => x.lote === selected.lote);
  if (idx >= 0) audits[idx] = record;
  else audits.push(record);

  toast("Lote conferido com sucesso!");
  closeConf();
  render();
}

async function deleteCurrentAuditHistory(){
  if (!selected) return;
  if (!confirm(`Deseja realmente excluir o histórico de auditoria do lote ${selected.lote}?`)) return;

  let { error } = await db.from(TABLE_NAME)
    .delete()
    .eq("local", meta.local)
    .eq("lote", selected.lote)
    .eq("data_verificacao", meta.data_verificacao);

  if (error) return toast("Erro ao excluir histórico: " + error.message);

  audits = audits.filter(x => x.lote !== selected.lote);
  toast("Histórico excluído com sucesso.");
  closeConf();
  render();
}

async function saveFullSession(){

function openNewLotModal(){
  set("nl_local", meta.local || "");
  set("nl_uf", "GO");
  set("nl_filial", "");
  set("nl_deposito", "");
  set("nl_cultura", "");
  set("nl_lote", "");
  set("nl_cultivar", "");
  set("nl_cod_produto", "");
  set("nl_nome_produto_erp", "");
  set("nl_cat", "");
  set("nl_pen", "");
  set("nl_um", "BAG");
  set("nl_qtd_sistema", "0");
  set("nl_peso_etiqueta", "");
  $("newLotModal").classList.remove("hidden");
}

function closeNewLotModal(){
  $("newLotModal").classList.add("hidden");
}

async function saveNewLot(){
  let lote = v("nl_lote").trim();
  let local = v("nl_local").trim();
  let qtd = parseFloat(v("nl_qtd_sistema"));

  if (!lote || !local) return toast("Preencha o local e o lote.");
  if (isNaN(qtd)) qtd = 0;

  let record = {
    local: local,
    uf: v("nl_uf"),
    filial: v("nl_filial"),
    deposito: v("nl_deposito"),
    cultura: v("nl_cultura"),
    lote: lote,
    cultivar: v("nl_cultivar"),
    cat: v("nl_cat"),
    pen: v("nl_pen"),
    um: v("nl_um"),
    qtd_sistema: qtd,
    peso_etiqueta: parseFloat(v("nl_peso_etiqueta")) || null
  };

  let { error } = await db.from("base_dados").upsert(record);
  if (error) return toast("Erro ao cadastrar novo lote: " + error.message);

  base.push(record);
  populateLotFilters();
  render();
  closeNewLotModal();
  toast("Novo lote inserido na base!");
}

window.onload = async () => {
  await loadLocalsStart();
  await dashboard();
};
