<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoria - Conferência de Estoque</title>
  <style>
    /* Estilos Globais e Layout */
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      color: #333;
    }
    header {
      background-color: #1b5e37;
      color: white;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-container {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-box {
      background: white;
      padding: 4px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
    }
    .logo-img {
      height: 32px;
    }
    .header-actions {
      margin-left: auto;
    }

    /* Botões */
    button {
      cursor: pointer;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.2s;
    }
    button.sec {
      background-color: #e9ecef;
      color: #1b5e37;
    }
    button.sec:hover {
      background-color: #dce1e6;
    }
    button.pri {
      background-color: #1b5e37;
      color: white;
    }
    button.pri:hover {
      background-color: #144729;
    }

    /* Main Container */
    .container {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Grid do Formulário de Pesquisa */
    .section-title {
      color: #1b5e37;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .grid-7 {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .grid-7 label {
      font-size: 11px;
      font-weight: bold;
      color: #555;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
    }
    .grid-7 input {
      margin-top: 6px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
    }
    .autocomplete-wrapper {
      position: relative;
    }
    .suggestions-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 6px 6px;
      max-height: 150px;
      overflow-y: auto;
      z-index: 10;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho com o Botão de Dashboard no Canto Superior Direito -->
  <header>
    <div class="brand-container">
      <div class="logo-box">
        <img src="https://github.com/s4mu3l-king/Auditoria/blob/main/logo.png%20-%20Copia.png?raw=true" alt="Logo Cereal Ouro" class="logo-img">
      </div>
      <div>
        <b>♟ AUDITORIA</b> <small>Conferência de Estoque</small>
      </div>
    </div>

    <div class="header-actions">
      <button class="sec" onclick="go('home')">Dashboard</button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <div class="container">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 16px;">
      <button class="pri" onclick="novaAuditoria()">NOVA AUDITORIA</button>
    </div>

    <!-- Seção de Pesquisa com Alinhamento Vertical Ajustado -->
    <h3 class="section-title">Pesquisa e Seleção do Lote</h3>
    <div class="grid-7">
      <div class="autocomplete-wrapper">
        <label>
          PESQUISAR LOTE (Digite ex: 1417)
          <input id="searchLoteInput" placeholder="Digite o lote..." oninput="onSearchLoteInput()" autocomplete="off">
        </label>
        <div id="suggestionsBox" class="suggestions-box hidden"></div>
      </div>
      <label>CULTIVAR<input id="dispCultivar" readonly style="background:#e9ecef" value="761 I2X"></label>
      <label>CAT<input id="dispCat" readonly style="background:#e9ecef" value="S2"></label>
      <label>PENEIRA<input id="dispPeneira" readonly style="background:#e9ecef" value="P1"></label>
      <label>U.M.<input id="dispUm" readonly style="background:#e9ecef" value="BG"></label>
      <label>TRATAMENTO<input id="dispTratamento" readonly style="background:#e9ecef" value="SEM TRATAMENTO"></label>
      <label>QTD SISTEMA<input id="dispQtdSistema" readonly style="background:#e9ecef; font-weight:bold" value="30"></label>
    </div>
  </div>

  <script>
    function go(route) {
      console.log("Navegando para:", route);
    }

    function novaAuditoria() {
      console.log("Nova auditoria iniciada.");
    }

    function onSearchLoteInput() {
      // Lógica de busca e autocompletar
    }
  </script>

</body>
</html>
